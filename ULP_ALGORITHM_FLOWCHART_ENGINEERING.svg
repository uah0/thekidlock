<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1600" viewBox="0 0 2200 1600">
<defs>
  <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0L12,6L0,12Z" fill="#334155"/></marker>
  <filter id="s" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".16"/></filter>
  <style>
    .t{font:700 36px Arial;fill:#0f172a}.sub{font:16px Arial;fill:#475569}.h{font:700 22px Arial;fill:#fff}.bt{font:700 18px Arial;fill:#0f172a}.tx{font:16px Arial;fill:#334155}.sm{font:14px Arial;fill:#475569}.lb{font:700 14px Arial;fill:#334155}.box{stroke-width:2;rx:13;filter:url(#s)}.ar{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:8 7}
  </style>
</defs>
<rect width="2200" height="1600" fill="#f8fafc"/>
<text x="1100" y="52" text-anchor="middle" class="t">ULP lock controller — инженерная блок-схема</text>
<text x="1100" y="82" text-anchor="middle" class="sub">ESP32-S3 · mailbox с основным CPU · диагностика положения пластины по ADC и току соленоида</text>

<!-- Mailbox -->
<rect x="55" y="120" width="2090" height="150" fill="#e0f2fe" stroke="#0284c7" class="box"/>
<text x="1100" y="153" text-anchor="middle" class="bt">Общий mailbox: CPU ↔ ULP</text>
<text x="90" y="190" class="tx">CPU → ULP: command, command_sequence</text>
<text x="90" y="220" class="tx">ULP → CPU: command_ack_sequence, lock_state, fsm_state, plate_state, fault_flags, event_flags</text>
<text x="1160" y="190" class="tx">Измерения: baseline_raw, vbat_raw, sense_raw, delta_raw, normalized_feature</text>
<text x="1160" y="220" class="tx">Диагностика: close_verify_*, counters; sequence — seqlock для целостного snapshot</text>
<path d="M1100 270V305" class="ar"/>

<!-- Cycle -->
<rect x="720" y="305" width="760" height="72" fill="#fef3c7" stroke="#d97706" class="box"/>
<text x="1100" y="336" text-anchor="middle" class="bt">Пробуждение ULP (период ~40 мс)</text>
<text x="1100" y="362" text-anchor="middle" class="tx">read_command() → принять только стабильный новый sequence</text>
<path d="M1100 377V410" class="ar"/>
<polygon points="1100,410 1240,485 1100,560 960,485" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#s)"/>
<text x="1100" y="480" text-anchor="middle" class="bt">Команда?</text>
<text x="1100" y="505" text-anchor="middle" class="sm">OPEN / CLOSE / invalid</text>
<path d="M960 485H390V590" class="ar"/><text x="690" y="472" class="lb">OPEN</text>
<path d="M1240 485H1810V590" class="ar"/><text x="1500" y="472" class="lb">CLOSE</text>
<path d="M1100 560V590" class="ar"/><text x="1115" y="580" class="lb">invalid</text>

<!-- Common diagnostic header -->
<rect x="70" y="590" width="640" height="60" fill="#0f766e" stroke="#115e59" class="box"/>
<text x="390" y="629" text-anchor="middle" class="h">OPEN: проверить выключенное состояние</text>
<rect x="1530" y="590" width="640" height="60" fill="#6d28d9" stroke="#5b21b6" class="box"/>
<text x="1850" y="629" text-anchor="middle" class="h">CLOSE: диагностировать пластину</text>

<!-- OPEN branch -->
<path d="M390 650V690" class="ar"/>
<rect x="100" y="690" width="580" height="78" fill="#ccfbf1" stroke="#14b8a6" class="box"/>
<text x="390" y="722" text-anchor="middle" class="bt">1. Gate LOW</text><text x="390" y="748" text-anchor="middle" class="tx">соленоид выключен; ожидание ULP_OFF_GUARD_US</text>
<path d="M390 768V805" class="ar"/>
<rect x="100" y="805" width="580" height="78" fill="#ccfbf1" stroke="#14b8a6" class="box"/>
<text x="390" y="837" text-anchor="middle" class="bt">2. ADC остаточного тока</text><text x="390" y="863" text-anchor="middle" class="tx">8 samples → coil_current_raw</text>
<path d="M390 883V915" class="ar"/>
<polygon points="390,915 500,978 390,1041 280,978" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#s)"/>
<text x="390" y="973" text-anchor="middle" class="bt">residual ≤ 80?</text><text x="390" y="996" text-anchor="middle" class="sm">катушка выключена?</text>
<path d="M280 978H120V1110" class="ar"/><text x="185" y="966" class="lb">НЕТ</text>
<rect x="70" y="1110" width="250" height="96" fill="#fee2e2" stroke="#dc2626" class="box"/>
<text x="195" y="1145" text-anchor="middle" class="bt">FAULT</text><text x="195" y="1170" text-anchor="middle" class="tx">COIL_SHORT</text><text x="195" y="1192" text-anchor="middle" class="sm">OPEN_FAILED</text>
<path d="M500 978H650V1110" class="ar"/><text x="535" y="966" class="lb">ДА</text>
<rect x="520" y="1110" width="250" height="96" fill="#dcfce7" stroke="#16a34a" class="box"/>
<text x="645" y="1145" text-anchor="middle" class="bt">UNLOCKED</text><text x="645" y="1170" text-anchor="middle" class="tx">event: UNLOCKED</text><text x="645" y="1192" text-anchor="middle" class="sm">после этого — measure_plate()</text>

<!-- CLOSE diagnostic -->
<path d="M1850 650V690" class="ar"/>
<rect x="1560" y="690" width="580" height="72" fill="#ede9fe" stroke="#8b5cf6" class="box"/>
<text x="1850" y="720" text-anchor="middle" class="bt">1. Gate LOW + off guard</text><text x="1850" y="745" text-anchor="middle" class="tx">механизм должен быть в покое</text>
<path d="M1850 762V795" class="ar"/>
<rect x="1560" y="795" width="580" height="72" fill="#ede9fe" stroke="#8b5cf6" class="box"/>
<text x="1850" y="825" text-anchor="middle" class="bt">2. Baseline ADC</text><text x="1850" y="850" text-anchor="middle" class="tx">8 samples канала SENSE → baseline_raw</text>
<path d="M1850 867V900" class="ar"/>
<rect x="1560" y="900" width="580" height="72" fill="#ede9fe" stroke="#8b5cf6" class="box"/>
<text x="1850" y="930" text-anchor="middle" class="bt">3. VBAT ADC</text><text x="1850" y="955" text-anchor="middle" class="tx">8 samples → vbat_raw; проверка vbat_raw ≥ 100</text>
<path d="M1850 972V1005" class="ar"/>
<rect x="1560" y="1005" width="580" height="72" fill="#ede9fe" stroke="#8b5cf6" class="box"/>
<text x="1850" y="1035" text-anchor="middle" class="bt">4. Диагностический импульс</text><text x="1850" y="1060" text-anchor="middle" class="tx">Gate HIGH на 2 мс → SENSE → Gate LOW</text>
<path d="M1850 1077V1110" class="ar"/>
<rect x="1560" y="1110" width="580" height="96" fill="#ede9fe" stroke="#8b5cf6" class="box"/>
<text x="1850" y="1142" text-anchor="middle" class="bt">5. Расчёт признака положения</text>
<text x="1850" y="1167" text-anchor="middle" class="tx">delta = max(sense − baseline, 0)</text>
<text x="1850" y="1190" text-anchor="middle" class="tx">feature = delta × 100000 / vbat</text>

<!-- classification -->
<path d="M1850 1206V1240" class="ar"/>
<rect x="1440" y="1240" width="820" height="180" fill="#f1f5f9" stroke="#64748b" class="box"/>
<text x="1850" y="1272" text-anchor="middle" class="bt">6. classify_feature(feature)</text>
<text x="1470" y="1305" class="tx">≤ 12000 — CONTACT</text><text x="1690" y="1305" class="tx">≤ 19500 — GAP_1</text><text x="1910" y="1305" class="tx">≤ 26500 — GAP_2</text><text x="2130" y="1305" class="tx">≤ 35000 — GAP_3</text>
<text x="1470" y="1340" class="tx">≤ 42000 — GAP_4</text><text x="1690" y="1340" class="tx">≤ 48000 — GAP_5</text><text x="1910" y="1340" class="tx">≥ 48000 — FAR</text>
<text x="1470" y="1380" class="sm">Гистерезис FAR: выход из FAR происходит только ниже 45200</text>

<!-- close decision -->
<path d="M1850 1420V1450" class="ar"/>
<polygon points="1850,1450 1990,1510 1850,1570 1710,1510" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#s)"/>
<text x="1850" y="1505" text-anchor="middle" class="bt">CONTACT или GAP_1?</text>
<path d="M1710 1510H1500" class="ar"/><text x="1580" y="1498" class="lb">НЕТ</text>
<path d="M1990 1510H2160" class="ar"/><text x="2030" y="1498" class="lb">ДА</text>

<!-- right outcomes -->
<rect x="1250" y="1460" width="230" height="90" fill="#fee2e2" stroke="#dc2626" class="box"/>
<text x="1365" y="1495" text-anchor="middle" class="bt">CLOSE_REJECTED</text><text x="1365" y="1522" text-anchor="middle" class="sm">Gate LOW · UNLOCKED</text>
<rect x="2010" y="1460" width="180" height="90" fill="#ede9fe" stroke="#8b5cf6" class="box"/>
<text x="2100" y="1495" text-anchor="middle" class="bt">Gate HIGH</text><text x="2100" y="1522" text-anchor="middle" class="sm">300 мс hold</text>

<!-- bottom engineering notes -->
<rect x="70" y="1260" width="1080" height="220" fill="#fff7ed" stroke="#ea580c" class="box"/>
<text x="610" y="1295" text-anchor="middle" class="bt">Ошибки и защитные реакции</text>
<text x="100" y="1330" class="tx">• ADC/VBAT/SENSE invalid → FAULT</text>
<text x="100" y="1360" class="tx">• delta &lt; 40 → COIL_OPEN</text>
<text x="100" y="1390" class="tx">• остаточный ток после OPEN &gt; 80 → COIL_SHORT</text>
<text x="100" y="1420" class="tx">• FAULT защёлкивается; команда CLOSE не запускает повторный цикл</text>
<text x="100" y="1450" class="tx">• OPEN сбрасывает FAULT и повторно вооружает контроллер</text>

<rect x="1190" y="80" width="930" height="30" fill="#fee2e2" stroke="#dc2626" rx="8"/>
<text x="1655" y="101" text-anchor="middle" class="sm">Инженерное замечание: текущий close_verify сохраняет результат предварительной диагностики; отдельное ADC-подтверждение после 300 мс hold ещё не выполняется.</text>
</svg>
