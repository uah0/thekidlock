name: Port character-controls base

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port-and-check:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/character-controls'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || 'feature/character-controls' }}

      - name: Apply vetted release fixes
        run: |
          python android_lock_beacon/tools/port_play_release_fixes.py
          git rm -f android_lock_beacon/.character_controls_migration 2>/dev/null || true
          git rm -f .github/workflows/character-controls-check.yml 2>/dev/null || true
          git rm -f android_lock_beacon/tools/port_play_release_fixes.py 2>/dev/null || true
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Port production-safe Android release fixes"
            git push origin HEAD:feature/character-controls
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Lint and build
        working-directory: android_lock_beacon
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintRelease bundleRelease assembleDebug
