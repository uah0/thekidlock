name: Character controls check

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'android_lock_beacon/**'
      - '.github/workflows/character-controls-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Port production-safe release fixes
        run: |
          python android_lock_beacon/tools/port_play_release_fixes.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android_lock_beacon
            git commit -m "Port production-safe Android release fixes"
            git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Lint and build
        working-directory: android_lock_beacon
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintRelease bundleRelease assembleDebug

      - name: Upload phone-test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: character-controls-phone-test-apk
          path: android_lock_beacon/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
