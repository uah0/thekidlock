name: Fix character-controls battery migration

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix-and-check:
    if: github.head_ref == 'feature/character-controls'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/character-controls

      - name: Fix migrated battery settings method
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android_lock_beacon/app/src/main/java/com/blelock/app/MainActivity.kt')
          text = p.read_text(encoding='utf-8')
          old = '''    private fun openBatteryOptimizationSettings() {
              val powerManager = getSystemService(PowerManager::class.java)
              if (powerManager?.isIgnoringBatteryOptimizations(packageName) == true) return
              startActivity(Intent(
                  Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                  Uri.parse("package:$packageName")
              ))
          }'''
          if old not in text:
              # tolerate normal 4-space body indentation
              old = '''    private fun openBatteryOptimizationSettings() {
                  val powerManager = getSystemService(PowerManager::class.java)
                  if (powerManager?.isIgnoringBatteryOptimizations(packageName) == true) return
                  startActivity(Intent(
                      Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                      Uri.parse("package:$packageName")
                  ))
              }'''
          new = '''    private fun openBatteryOptimizationSettings() {
              val intent = Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS)
              runCatching { startActivity(intent) }
                  .onFailure { startActivity(Intent(Settings.ACTION_SETTINGS)) }
          }'''
          if old not in text:
              raise SystemExit('old battery method not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android_lock_beacon/app/src/main/java/com/blelock/app/MainActivity.kt
          git commit -m "Fix battery settings migration"
          git push origin HEAD:feature/character-controls

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint and build
        working-directory: android_lock_beacon
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintRelease bundleRelease assembleDebug
