<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мастер настройки замка</title><style>
body{font-family:Arial,sans-serif;background:#f3f5f7;color:#20242a;margin:0;padding:20px}main{max-width:680px;margin:auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 30px #0002}h1{font-size:25px}.steps{display:flex;gap:7px;flex-wrap:wrap}.step{padding:8px 12px;border-radius:20px;background:#e8ebef}.step.on{background:#d9e9ff;font-weight:bold}.step.done{background:#dff3e7}.card{margin:18px 0;padding:18px;border-radius:12px;background:#f7f8fa;font-size:19px;line-height:1.45}.progress{height:14px;background:#e1e5ea;border-radius:8px;overflow:hidden}.bar{height:100%;width:0;background:#248759;transition:width .25s}.data{margin-top:14px;color:#667;font-family:monospace}button{padding:11px 16px;border:0;border-radius:9px;font-size:16px;cursor:pointer}#repeat{background:#e8ebef}#cancel{background:#a92323;color:white}.ok{color:#167344}.bad{color:#a92323}</style></head><body><main>
<h1>Мастер настройки замка</h1><p>Подготовьте один лист офисной или газетной бумаги. На время настройки замок отпускается. Сессия автоматически завершится через 2 минуты.</p>
<div class="steps"><span id="s0" class="step on">1. Один лист</span><span id="s1" class="step">2. Дверь открыта</span><span id="s2" class="step">3. Контакт</span><span id="s3" class="step">4. Готово</span></div>
<div id="instruction" class="card">Запуск…</div><div class="progress"><div id="bar" class="bar"></div></div><div id="status" class="data">Ожидание ESP32…</div><p><button id="repeat" onclick="repeatInstruction()">Повторить инструкцию</button> <button id="cancelBtn" onclick="cancelWizard()">Отмена</button></p>
</main><script>
const displayTexts=[
'Подготовьте один лист бумаги. Подложите его между магнитом и пластиной. Плотно закройте дверь и удерживайте её рукой.',
'Откройте дверь, уберите лист и держите дверь открытой.',
'А теперь закройте дверь без бумаги и удерживайте, хорошо прижимая рукой.',
'Настройка завершена.'
];
const speechTexts=[
'Подгото́вьте оди́н лист бума́ги. Подложи́те его́ ме́жду магни́том и пласти́ной. Пло́тно закро́йте дверь и уде́рживайте её руко́й.',
'Откро́йте дверь, убери́те лист и держи́те дверь откры́той.',
'А тепе́рь закро́йте дверь без бума́ги и уде́рживайте, хорошо́ прижима́я руко́й.',
'Настро́йка завершена́.'
];let stage=0,values={},samples=[],lastCounter=-1,finished=false,timer,collecting=false,speechToken=0;
function say(display=displayTexts[stage],speech=speechTexts[stage],done){instruction.textContent=display;collecting=false;let token=++speechToken;if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(speech);u.lang='ru-RU';let finish=()=>{if(token===speechToken&&done)done()};u.onend=finish;u.onerror=finish;speechSynthesis.speak(u)}else setTimeout(()=>{if(token===speechToken&&done)done()},300)}
function beginCollecting(){samples=[];collecting=true;bar.style.width='0';status.textContent='Удерживайте положение: 0/20'}
function repeatInstruction(){samples=[];say(displayTexts[stage],speechTexts[stage],beginCollecting)}
function setStage(n){stage=n;samples=[];collecting=false;for(let i=0;i<4;i++){let e=document.getElementById('s'+i);e.className='step'+(i<n?' done':i===n?' on':'')}bar.style.width='0';if(n<3){status.textContent='Сначала выслушайте инструкцию';say(displayTexts[n],speechTexts[n],beginCollecting)}else say(displayTexts[n],speechTexts[n])}
async function api(url,opt){let r=await fetch(url,opt);if(!r.ok)throw Error(await r.text());return r.json()}
function median(a){let b=[...a].sort((x,y)=>x-y);return b[Math.floor(b.length/2)]}
function stable(){if(samples.length<20)return false;let m=median(samples),range=Math.max(...samples)-Math.min(...samples);return range<=Math.max(12,Math.abs(m)*.12)}
function expired(){finished=true;collecting=false;clearInterval(timer);speechToken++;if('speechSynthesis'in window)speechSynthesis.cancel();status.className='data bad';status.textContent='Сессия калибровки завершена. Для новой настройки откройте мастер заново.';cancelBtn.textContent='Закрыть';repeat.disabled=true}
async function tick(){if(finished)return;try{let u=await api('/api/ulp');if(!u.calibration_mode){expired();return}if(!collecting)return;if(u.measurement_counter===lastCounter)return;lastCounter=u.measurement_counter;if(u.delta_raw<0)return;samples.push(u.delta_raw);if(samples.length>20)samples.shift();let ok=stable();bar.style.width=Math.min(100,samples.length*5)+'%';status.textContent=`delta=${u.delta_raw}; измерений: ${samples.length}/20; стабильно: ${ok?'да':'нет'}`;if(ok){collecting=false;await completeStage()}}catch(e){status.textContent='Ошибка связи: '+e}}
function delay(ms){return new Promise(r=>setTimeout(r,ms))}
async function hotVerifySample(index){let before=(await api('/api/ulp')).calibration_verify_counter;await api('/api/ulp/calibration?action=verify',{method:'POST'});for(let n=0;n<30;n++){await delay(200);let u=await api('/api/ulp');if(!u.calibration_mode){expired();throw Error('Сессия калибровки завершена')}if(u.calibration_verify_counter!==before){status.textContent=`Контроль полного контакта: ${index}/5; delta=${u.calibration_verify_raw}`;return u.calibration_verify_raw}}throw Error('Нет ответа контрольного цикла')}
async function saveCalibration(){status.textContent='Не отпускайте дверь: контроль полного контакта';values.verify=await hotVerifySample(1);clearInterval(timer);let q=new URLSearchParams({action:'save',contact:values.contact,paper1:values.paper1,open:values.open,verify:values.verify});await api('/api/ulp/calibration?'+q,{method:'POST'});finished=true;setStage(3);status.className='data ok';status.textContent=`Сохранено: контакт ${values.contact}; контроль ${values.verify}; 1 лист ${values.paper1}; открыто ${values.open}`;cancelBtn.textContent='Закрыть'}
async function completeStage(){let v=median(samples);if(stage===0)values.paper1=v;if(stage===1){if(v<=values.paper1+Math.max(10,Math.abs(values.paper1)*.05)){say('Дверь ещё не определена как открытая. '+displayTexts[1],'Дверь ещё не определена́ как откры́тая. '+speechTexts[1],beginCollecting);return}values.open=v}if(stage===2){if(v>=values.paper1-Math.max(10,Math.abs(values.paper1)*.05)){say('Дверь ещё не прижата до полного контакта. '+displayTexts[2],'Дверь ещё не при́жата до по́лного конта́кта. '+speechTexts[2],beginCollecting);return}values.contact=v;let paper2=values.paper1+(values.paper1-values.contact);if(values.open<=paper2){say('Открытая дверь слишком близко к пластине. Повторите измерение открытой двери.','Откры́тая дверь сли́шком бли́зко к пласти́не. Повтори́те измере́ние откры́той две́ри.',()=>setStage(1));return}await saveCalibration();return}setStage(stage+1)}
async function cancelWizard(){if(!finished)await api('/api/ulp/calibration?action=cancel',{method:'POST'}).catch(()=>{});window.close()}
async function start(){try{await api('/api/ulp/calibration?action=start',{method:'POST'});setStage(0);timer=setInterval(tick,250)}catch(e){status.className='data bad';status.textContent=e}}
addEventListener('beforeunload',()=>{if(!finished)navigator.sendBeacon('/api/ulp/calibration?action=cancel','')});start();
</script></body></html>
