<!doctype html>
<html lang="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<style>
:root{
  --bg:#0a0c0f;
  --surface:#12151b;
  --surface-2:#181d24;
  --surface-3:#1e242c;
  --border:#242a33;
  --border-soft:#1a1f26;
  --text:#e8ecf1;
  --text-dim:#8b93a3;
  --text-faint:#565f6c;
  --accent:#4da8ff;
  --accent-dim:rgba(77,168,255,.14);
  --good:#2dd4a8;
  --good-dim:rgba(45,212,168,.14);
  --warn:#f5a623;
  --warn-dim:rgba(245,166,35,.14);
  --bad:#f0555f;
  --bad-dim:rgba(240,85,95,.14);
  --radius:12px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{visibility:hidden}
body.localized{visibility:visible}
body{
  margin:0;font-family:var(--sans);background-color:var(--bg);color:var(--text);
  background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.035) 1px, transparent 0);
  background-size:22px 22px;
  min-height:100vh;
}
.wrap{max-width:980px;margin:0 auto;padding:20px 40px 64px 16px;touch-action:pan-y}
a{color:var(--accent)}
button,input,select{font-family:inherit;font-size:14px;color:var(--text)}
::selection{background:var(--accent-dim)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

[hidden]{display:none!important}
.settings-title{font-size:17px;margin:0 0 14px}
.versions{display:flex;flex-wrap:wrap;gap:14px 28px;padding:14px 16px;margin:0 0 18px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.version-item{flex:1;min-width:200px;display:flex;flex-direction:column;gap:5px}
.version-item[hidden]{display:none}
.version-update{flex:1 1 300px;min-width:0}
.version-label{font-size:11px;color:var(--text-dim);letter-spacing:.04em}
.version-value{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.version-date{font-size:11px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.tag{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.09em;
  color:var(--accent);background:var(--accent-dim);border:1px solid rgba(77,168,255,.25);
  border-radius:5px;padding:2px 6px;display:inline-block;text-transform:uppercase;
}

/* panels */
.panel{
  background:linear-gradient(180deg,var(--surface),var(--surface) 60%,var(--surface-2));
  border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 18px 20px;margin:0 0 14px;
}
.panel-head{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.panel-head h2{font-size:14px;margin:0;font-weight:650;letter-spacing:.01em}
.panel-sub{color:var(--text-dim);font-size:12.5px;margin:10px 0 0;line-height:1.5}
.cfg-diagnostics{margin-top:24px;padding-top:18px;border-top:1px solid var(--border)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid-2{grid-template-columns:1fr}}

/* hero */
.hero{
  border:1px solid var(--border);border-radius:var(--radius);
  background:
    radial-gradient(120% 140% at 0% 0%, rgba(77,168,255,.10), transparent 55%),
    linear-gradient(180deg,var(--surface),var(--surface-2));
  padding:20px 20px 22px;margin-bottom:16px;
}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.led-rail{display:flex;gap:16px;flex-wrap:wrap}
.led-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-dim);font-family:var(--mono)}
.led{width:8px;height:8px;border-radius:50%;background:#2a2f38;display:inline-block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.led.on{background:var(--accent);box-shadow:0 0 9px 1px rgba(77,168,255,.65)}
.led-item.err .led.on{background:var(--bad);box-shadow:0 0 9px 1px rgba(240,85,95,.6)}

.hero-main{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.lock-state{display:flex;align-items:center;gap:12px;min-width:170px}
.state-dot{width:13px;height:13px;border-radius:50%;background:var(--text-faint);flex:none}
.lock-state.good .state-dot{background:var(--good);box-shadow:0 0 14px 2px rgba(45,212,168,.55)}
.lock-state.warn .state-dot{background:var(--warn);box-shadow:0 0 14px 2px rgba(245,166,35,.55);animation:pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.lock-state.warn .state-dot{animation:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.state-text{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.03em}
.lock-state.good .state-text{color:var(--good)}
.lock-state.warn .state-text{color:var(--warn)}
.state-err{font-family:var(--mono);font-size:11.5px;color:var(--bad);margin-top:2px}

.hero-metrics{display:flex;gap:26px;flex-wrap:wrap}
.metric{display:flex;flex-direction:column;gap:5px}
.metric-label{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em}
.metric-value{font-family:var(--mono);font-size:13.5px;color:var(--text)}
.rssi{display:flex;align-items:flex-end;gap:8px}
.rssi-bars{display:flex;align-items:flex-end;gap:2.5px;height:16px}
.rssi-bars .bar{width:4px;background:#2a2f38;border-radius:1px}
.rssi-bars .bar:nth-child(1){height:35%}
.rssi-bars .bar:nth-child(2){height:58%}
.rssi-bars .bar:nth-child(3){height:78%}
.rssi-bars .bar:nth-child(4){height:100%}
.rssi-bars .bar.on{background:var(--accent)}
.rssi-bars.weak .bar.on{background:var(--warn)}

.hero-actions{margin-left:auto}

/* buttons */
button{
  background:var(--surface-3);border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:560;
  transition:background-color .15s,border-color .15s,transform .08s;
}
button:hover{background:#232a34;border-color:#2e3542}
button:active{transform:scale(.98)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:700}
.btn-primary:hover{background:#66b7ff;border-color:#66b7ff}
.btn-danger{background:transparent;border-color:rgba(240,85,95,.35);color:#ff8790}
.btn-danger:hover{background:var(--bad-dim);border-color:var(--bad)}
.btn-ghost{background:transparent}
button.command-ok{background:var(--good);border-color:var(--good);color:#04231b}
button:disabled{opacity:.45;cursor:default}

/* inputs */
input[type=number],input[type=text],input[type=password],select,textarea{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  border-radius:7px;padding:9px 10px;width:100%;
}
#wssid,#wpass{background:#fff;color:#000;-webkit-text-fill-color:#000}
input:focus,select:focus{border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--text-dim)}
.knob-card{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-2);padding:16px 12px;margin-bottom:14px}
.knob-card label{display:block;text-align:center;color:var(--text);font-size:13px;font-weight:600}
.test-open-button.active{background:var(--good-dim);border-color:var(--good);color:var(--good)}
.test-open-action{font-weight:700;margin-left:8px}
.field-input{display:flex;align-items:center;gap:8px}
.field-input .unit{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);white-space:nowrap}
.mqtt-broker-picker{position:relative}
.mqtt-broker-input{display:flex;align-items:stretch}
.mqtt-broker-input input{flex:1;min-width:0;border-radius:7px 0 0 7px}
.mqtt-broker-input>button{flex:0 0 44px;padding:8px;border-radius:0 7px 7px 0;font-size:20px}
.mqtt-broker-list{position:absolute;top:100%;left:0;right:0;z-index:20;margin-top:4px;max-height:240px;overflow-y:auto;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;box-shadow:0 8px 24px #0008}
.mqtt-broker-list button{display:block;width:100%;min-height:44px;text-align:left;border:0;border-radius:0;padding:10px 12px;overflow-wrap:anywhere;background:transparent}
.mqtt-broker-list button:hover,.mqtt-broker-list button:focus-visible{background:var(--accent-dim)}
.field-row{display:flex;gap:14px;align-items:flex-start}
.actions-row{display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap}
.saved-msg{font-size:12.5px;color:var(--good);font-family:var(--mono)}

.zone-slider{display:none}
.knob-control{display:block;width:min(225px,100%);aspect-ratio:1;margin:8px auto 2px;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:grab;border-radius:50%;-webkit-tap-highlight-color:transparent}
.knob-control:active{cursor:grabbing}
.knob-control:focus-visible{outline:2px solid var(--accent);outline-offset:5px}
.knob-control svg{width:100%;height:100%;display:block;overflow:visible}
.knob-tick{stroke:rgba(255,255,255,.2);stroke-width:2;stroke-linecap:round}
.knob-tick.on{stroke:var(--accent)}
.knob-arc{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;opacity:.5}
.knob-body{stroke:var(--border);stroke-width:1.5}
.knob-grip{fill:none;stroke:rgba(255,255,255,.16);stroke-width:5;stroke-dasharray:1.5 3.1}
.knob-rot line{stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.knob-direction{fill:none;stroke:var(--text-dim);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.knob-num{fill:var(--text);font-size:27px;font-weight:650;text-anchor:middle;font-variant-numeric:tabular-nums}
.knob-body.save-flash{animation:knob-save-flash 700ms ease-out}
@keyframes knob-save-flash{0%,100%{fill:var(--knob-rest-fill)}20%,55%{fill:var(--good)}38%,75%{fill:var(--knob-rest-fill)}}
.knob-unit{fill:var(--text-dim);font-size:11px;text-anchor:middle}
/* toggle switch */
.switch-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-dim);margin-top:6px}
.switch{position:relative;display:inline-block;width:36px;height:20px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch .track{position:absolute;inset:0;background:var(--surface-3);border:1px solid var(--border);border-radius:999px;transition:background-color .15s}
.switch .thumb{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--text-faint);transition:transform .15s,background-color .15s}
.switch input:checked + .track{background:var(--accent-dim);border-color:var(--accent)}
.switch input:checked + .track .thumb{transform:translateX(16px);background:var(--accent)}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}

/* register / telemetry table */
.chips-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chip{
  flex:1 1 140px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:9px;
  padding:10px 12px;
}
.chip .k{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.chip .v{font-family:var(--mono);font-size:14px}
.reg{width:100%;border-collapse:collapse;font-size:13px}
.reg td{padding:7px 4px;border-bottom:1px solid var(--border-soft)}
.reg tr:last-child td{border-bottom:none}
.reg td:first-child{color:var(--text-dim)}
.reg td:last-child{font-family:var(--mono);text-align:right;color:var(--text);white-space:nowrap}
.badge-hex{
  font-family:var(--mono);font-size:12px;padding:1px 7px;border-radius:5px;
  background:var(--surface-3);border:1px solid var(--border)
}
.badge-hex.flag{background:var(--warn-dim);border-color:rgba(245,166,35,.3);color:var(--warn)}
.seq-line{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);margin-top:12px}

/* ble / bonds */
table.bonds{width:100%;border-collapse:collapse;margin-top:8px}
table.bonds th{text-align:left;font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;padding:6px 4px;border-bottom:1px solid var(--border)}
table.bonds td{padding:9px 4px;border-bottom:1px solid var(--border-soft);font-size:13px}
table.bonds td:first-child{font-family:var(--mono)}
.muted-row td{color:var(--text-faint);font-style:normal}
.type-chip{font-family:var(--mono);font-size:11px;color:var(--text-dim);background:var(--surface-3);border:1px solid var(--border);border-radius:5px;padding:1px 6px}

/* ota */
.dropzone{
  border:1px dashed var(--border);border-radius:10px;padding:20px;text-align:center;
  background:var(--surface-2);display:flex;flex-direction:column;align-items:center;gap:10px;
}
#ota{font-family:var(--mono);font-size:12.5px;color:var(--text-dim);white-space:pre-wrap;margin-top:10px;min-height:1em}

/* toast */
#notice{
  position:fixed;top:16px;right:16px;left:16px;max-width:380px;margin-left:auto;
  display:none;padding:12px 14px;border-radius:10px;background:var(--surface-2);
  border:1px solid var(--border);color:var(--text);font-size:13.5px;z-index:50;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}
#notice.ok{display:block;border-color:rgba(77,168,255,.35)}
#notice.bad{display:block;border-color:rgba(240,85,95,.4);color:#ffb3b8}

.footnote{color:var(--text-faint);font-size:11.5px;line-height:1.5;margin:0}
</style>
</head>
<body>
<div class="wrap">

<div id="notice"></div>

<h2 class="settings-title" data-wui="settings_title"></h2>

<section class="panel">
  <div class="actions-row">
    <button class="btn-primary" id="pairingButton" data-wui="allow_phone_registration" onclick="allowPairing()"></button>
  </div>

  <div class="panel-head" style="margin-top:18px"><h2 style="font-size:13px;color:var(--text-dim)" data-wui="registered_phones"></h2></div>
  <div class="actions-row" style="margin-bottom:2px">
    <button data-wui="refresh" onclick="loadBonds()"></button>
    <button class="btn-danger" data-wui="delete_all_phones" onclick="deleteAllBonds()"></button>
  </div>
  <table class="bonds">
    <thead><tr><th data-wui="name"></th><th data-wui="identity_address"></th><th></th></tr></thead>
    <tbody id="bonds"></tbody>
  </table>
</section>
    <section class="panel">
      <div class="panel-head"><span class="tag">NET</span><h2 data-wui="wifi"></h2></div>
      <div class="field">
        <label for="wssid" data-wui="wifi_ssid"></label>
        <input id="wssid" type="text" maxlength="32">
      </div>
      <div class="field">
        <label for="wpass" data-wui="wifi_password"></label>
        <input id="wpass" type="password" maxlength="64" data-wui-placeholder="wifi_password_keep">
      </div>
      <div class="switch-row">
        <label class="switch">
          <input id="wauto" type="checkbox" onchange="saveAutoConnect()">
          <span class="track"><span class="thumb"></span></span>
        </label>
        <span data-wui="wifi_auto_connect"></span>
        <span class="saved-msg" id="autoSaved"></span>
      </div>
      <div class="actions-row">
        <button data-wui="read" onclick="loadWifi()"></button>
        <button class="btn-primary" data-wui="save" onclick="saveWifi()"></button>
        <button id="restartButton" class="btn-danger" data-wui="restart_lock" onclick="restartEsp()"></button>
        <span class="saved-msg" id="wifiSaved"></span>
      </div>
      <div class="field" style="margin-top:20px">
        <label for="mHost" data-wui="broker_domain"></label>
        <div id="mqttBrokerField" class="mqtt-broker-picker">
          <div class="mqtt-broker-input">
            <input id="mHost" type="text" maxlength="192" data-wui-aria="public_broker_address" data-wui-placeholder="broker_domain" autocomplete="off" oninput="closeMqttBrokerList();mSaved.textContent=''">
            <button id="mqttBrokerButton" type="button" data-wui-aria="choose_broker" aria-expanded="false" aria-controls="mqttBrokerList" onclick="toggleMqttBrokerList()" disabled>▾</button>
          </div>
          <div id="mqttBrokerList" class="mqtt-broker-list" data-wui-aria="broker_addresses" hidden></div>
        </div>
        <div class="actions-row"><button id="mSave" class="btn-primary" data-wui="save" onclick="saveMqtt()"></button><span class="saved-msg" id="mSaved"></span></div>
      </div>
    </section>


<section class="panel">
    <div class="panel-head"><span class="tag">CFG</span><h2 data-wui="lock_settings"></h2></div>
  <div class="actions-row" style="margin-bottom:18px"><button class="btn-primary" data-wui="calibration_wizard" onclick="window.open('/calibration','lockCalibration','width=720,height=820')"></button></div>

    <div class="field knob-card">
      <label for="pr"><span data-wui="opening_zone"></span></label>
      <input id="pr" class="zone-slider" type="range" min="30" max="127" step="1" value="75" data-wui-aria="opening_zone_aria" oninput="updateZoneValue()" onchange="saveConfig('prKnob')">
      <div id="prKnob" class="knob-control" data-input="pr" data-unit="dBm" data-format="opening-zone" data-wui-aria="opening_zone_aria"></div>

    </div>
    <div class="field knob-card">
        <label for="departurePulse"><span data-wui="open_lock_sound_duration"></span></label>
      <input id="departurePulse" class="zone-slider" type="range" min="0" max="1000" step="1" value="635" oninput="updateDeparturePulseValue(true)" onchange="saveDeparturePulse()">
      <div id="departurePulseKnob" class="knob-control" data-input="departurePulse" data-unit="ms" data-format="pulse" data-wui-aria="open_lock_sound_duration"></div>
    </div>

    <div class="field knob-card">
        <label for="ta"><span data-wui="lock_close_delay"></span></label>
        <input id="ta" class="zone-slider" type="range" min="3000" max="10000" step="100" value="3000" oninput="updateTimerAValue()" onchange="saveConfig('taKnob')">
        <div id="taKnob" class="knob-control" data-input="ta" data-unit="s" data-format="seconds" data-wui-aria="lock_close_delay"></div>
    </div>
    <div class="field knob-card">
      <label for="beaconReopenProtection"><span data-wui="beacon_reopen_protection"></span></label>
      <input id="beaconReopenProtection" class="zone-slider" type="range" min="3000" max="8000" step="100" value="3000" oninput="updateBeaconReopenProtectionValue()" onchange="saveConfig('beaconReopenProtectionKnob')">
      <div id="beaconReopenProtectionKnob" class="knob-control" data-input="beaconReopenProtection" data-unit="s" data-format="seconds" data-wui-aria="beacon_reopen_protection"></div>
    </div>
    <!-- Diagnostics and the unlock test remain in the lower part of the configuration panel. -->
    <div class="cfg-diagnostics">
  <div class="actions-row" style="margin-bottom:14px">
    <button class="btn-primary test-open-button" id="testOpenButton" type="button" aria-pressed="false" onclick="testOpen()"><span data-wui="test_open"></span><span class="test-open-action" id="testOpenAction"></span></button>
  </div>
  <table class="reg">
    <tr><td data-wui="battery"></td><td id="ubattery">—</td></tr>
    <tr><td data-wui="current_gap"></td><td id="usense">—</td></tr>
    <tr><td data-wui="calibration_open"></td><td id="ucalopen">—</td></tr>
    <tr><td data-wui="door_not_closed_boundary"></td><td id="ucontactraw">—</td></tr>
  </table>
  <div class="seq-line" id="ulpStatus"></div>
    </div>
  </section>

<div class="versions" data-wui-aria="device_version">
  <div class="version-item">
    <span class="version-label" data-wui="device_lock"></span>
    <span class="version-date" id="uptimeTxt"></span>
    <span class="version-value" id="verTxt"></span>
    <span class="version-date" id="buildTxt"></span>
  </div>
  <div class="version-update">
    <div class="actions-row">
      <button class="btn-primary" id="uploadFwButton" data-wui="install_update" onclick="uploadFw()"></button>
    </div>
    <div id="ota"></div>
  </div>
</div>
</div>

<script>
window.wui=(key,values={})=>{const template=window.__wui?.[key];if(typeof template!=='string')return '';return template.replace(/\{([a-z_]+)\}/g,(_,name)=>String(values[name]??''))};
window.installAppWebUiTranslations=dictionary=>{window.__wui=dictionary;document.documentElement.lang=dictionary.locale;document.title=wui('page_title');document.querySelectorAll('[data-wui]').forEach(e=>e.textContent=wui(e.dataset.wui));document.querySelectorAll('[data-wui-placeholder]').forEach(e=>e.placeholder=wui(e.dataset.wuiPlaceholder));document.querySelectorAll('[data-wui-aria]').forEach(e=>e.setAttribute('aria-label',wui(e.dataset.wuiAria)));document.body.classList.add('localized')};
function uiError(error){const code=String(error||'').match(/WUI_E_[A-Z_]+/)?.[0]||'WUI_E_REQUEST';return wui('api.'+code)||wui('api.WUI_E_REQUEST')}
async function j(u,o){let r=await fetch(u,o);if(!r.ok){let body=await r.text();let code=body.match(/WUI_E_[A-Z_]+/)?.[0]||'WUI_E_REQUEST';throw Error(code)}return r.json()}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function formatUptime(total){total=Math.max(0,Math.floor(total));let d=Math.floor(total/86400),h=Math.floor(total%86400/3600),m=Math.floor(total%3600/60),s=total%60;return wui('uptime',{d,h:String(h).padStart(2,'0'),m:String(m).padStart(2,'0'),s:String(s).padStart(2,'0')})}
let noticeTimer=0,pendingConfirm='',pendingConfirmUntil=0;function showNotice(message,error=false){clearTimeout(noticeTimer);notice.textContent=message;notice.className=error?'bad':'ok';noticeTimer=setTimeout(()=>{notice.className='';},5000)}
async function inlineConfirm(key,message,action){let now=Date.now();if(pendingConfirm!==key||now>pendingConfirmUntil){pendingConfirm=key;pendingConfirmUntil=now+5000;showNotice(message);return}pendingConfirm='';pendingConfirmUntil=0;await action()}

// Circular controls keep the existing range inputs as the API/value bridge.
(()=>{
  const NS='http://www.w3.org/2000/svg',SW=270,TICKS=28;let uid=0;
  const point=(a,r)=>[100+r*Math.sin(a*Math.PI/180),100-r*Math.cos(a*Math.PI/180)];
  const svgEl=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e};
  function hapticTick(){if(window.BleLockHaptics&&typeof window.BleLockHaptics.tick==='function')window.BleLockHaptics.tick();else if(navigator.vibrate)navigator.vibrate(5)}
  function initKnob(el){
    const input=document.getElementById(el.dataset.input),min=Number(input.min),max=Number(input.max),step=Number(input.step)||1,span=max-min,gid='knob-gradient-'+(++uid);
    let value=Number(input.value),fraction=(value-min)/span,changed=false,lastVibrationNotch=Math.round(fraction*20);
    el.tabIndex=0;el.setAttribute('role','slider');el.setAttribute('aria-valuemin',min);el.setAttribute('aria-valuemax',max);el.setAttribute('aria-label',el.getAttribute('data-aria-label')||'');
    const svg=svgEl('svg',{viewBox:'0 0 200 200'},el),defs=svgEl('defs',{},svg),gradient=svgEl('radialGradient',{id:gid,cx:.35,cy:.3,r:.9},defs);
    svgEl('stop',{offset:0,'stop-color':'#2d3342'},gradient);svgEl('stop',{offset:1,'stop-color':'#13151c'},gradient);
    const ticks=[];for(let i=0;i<TICKS;i++){const a=-135+SW*i/(TICKS-1),big=i%9===0,p=point(a,big?86:89),q=point(a,96);ticks.push(svgEl('line',{class:'knob-tick',x1:p[0],y1:p[1],x2:q[0],y2:q[1]},svg))}
    const arc=svgEl('path',{class:'knob-arc'},svg),body=svgEl('circle',{class:'knob-body',cx:100,cy:100,r:62,fill:'url(#'+gid+')'},svg);body.style.setProperty('--knob-rest-fill','url(#'+gid+')');svgEl('circle',{class:'knob-grip',cx:100,cy:100,r:59},svg);
    const rot=svgEl('g',{class:'knob-rot'},svg);svgEl('line',{x1:100,y1:44,x2:100,y2:58},rot);const num=svgEl('text',{class:'knob-num',x:100,y:108},svg);svgEl('text',{class:'knob-unit',x:100,y:126},svg).textContent=el.dataset.unit||'';
    svgEl('path',{class:'knob-direction',d:'M78 172H60l8-7M60 172l8 7'},svg);
    svgEl('path',{class:'knob-direction',d:'M122 172h18l-8-7M140 172l-8 7'},svg);
    function draw(){const a=-135+SW*fraction,s=point(-135,78),e=point(a,78);rot.setAttribute('transform','rotate('+a+' 100 100)');arc.setAttribute('d',fraction<.002?'':'M'+s[0]+' '+s[1]+' A78 78 0 '+(a+135>180?1:0)+' 1 '+e[0]+' '+e[1]);ticks.forEach((t,i)=>t.classList.toggle('on',i/(TICKS-1)<=fraction+1e-6));
      let shown=value;if(el.dataset.format==='opening-zone')shown=-value;else if(el.dataset.format==='pulse')shown=pulseSliderToMs(value);else if(el.dataset.format==='seconds')shown=(value/1000).toFixed(1).replace('.',wui('decimal_separator'));
      num.textContent=shown;el.setAttribute('aria-valuenow',value);el.setAttribute('aria-valuetext',input.getAttribute('aria-valuetext')||String(shown)+(el.dataset.unit?' '+el.dataset.unit:''));
    }
    function set(next,notify=true){const v=Math.max(min,Math.min(max,Math.round(next/step)*step));if(v===value)return;value=v;fraction=(value-min)/span;draw();if(notify){input.value=String(value);input.dispatchEvent(new Event('input',{bubbles:true}));changed=true;const notch=Math.round(fraction*20);if(notch!==lastVibrationNotch){lastVibrationNotch=notch;hapticTick()}}}
    Object.defineProperty(el,'knobValue',{get:()=>value,set:v=>{value=Math.max(min,Math.min(max,Number(v)));fraction=(value-min)/span;draw()}});
    el.flashSavedValue=()=>{body.classList.remove('save-flash');void body.getBoundingClientRect();body.classList.add('save-flash');setTimeout(()=>body.classList.remove('save-flash'),750)};
    const pointers=new Map();
    el.addEventListener('pointerdown',e=>{if(pointers.size)return;pointers.set(e.pointerId,{startX:e.clientX,startY:e.clientY,startValue:value,axis:'pending'});if(e.pointerType!=='touch')el.setPointerCapture(e.pointerId)});
    el.addEventListener('pointermove',e=>{const p=pointers.get(e.pointerId);if(!p||p.axis==='vertical')return;const dx=e.clientX-p.startX,dy=e.clientY-p.startY;if(p.axis==='pending'){if(Math.hypot(dx,dy)<8)return;p.axis=Math.abs(dx)>Math.abs(dy)?'horizontal':'vertical';if(p.axis==='vertical')return;if(e.pointerType==='touch')el.setPointerCapture(e.pointerId)}if(p.axis==='horizontal')set(p.startValue+dx*span/el.getBoundingClientRect().width)});
    const finish=e=>{pointers.delete(e.pointerId);if(!pointers.size&&changed){input.dispatchEvent(new Event('change',{bubbles:true}));changed=false}};
    el.addEventListener('pointerup',finish);el.addEventListener('pointercancel',finish);
    el.addEventListener('keydown',e=>{const n={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1,PageUp:5,PageDown:-5}[e.key];if(n){e.preventDefault();set(value+n*step);if(changed){input.dispatchEvent(new Event('change',{bubbles:true}));changed=false}}else if(e.key==='Home'||e.key==='End'){e.preventDefault();set(e.key==='Home'?min:max);if(changed){input.dispatchEvent(new Event('change',{bubbles:true}));changed=false}}});
    input.addEventListener('input',()=>{el.knobValue=input.value});input.addEventListener('change',()=>{el.setAttribute('aria-valuetext',input.getAttribute('aria-valuetext')||'')});draw();
  }
  document.querySelectorAll('.knob-control').forEach(initKnob);
})();

document.addEventListener('click',e=>{if(e.target.closest('button')&&window.BleLockHaptics)window.BleLockHaptics.tick()});

let testActive=false,testKnown=false,testRequestPending=false,testLeaseRequest=null;
function renderTestState(active){
  testKnown=active!==null;testActive=active===true;
  testOpenButton.classList.toggle('active',testActive);
  testOpenButton.setAttribute('aria-pressed',String(testActive));
  testOpenButton.disabled=!testKnown||testRequestPending;
  testOpenAction.textContent=wui(testActive?'test_open_disable':'test_open_enable');
  if(!testActive||!testKnown)usense.textContent='—';
}

async function loadStatus(){
  try{
    let s=await j('/api/status');
    verTxt.textContent=wui('version',{value:s.version});
    buildTxt.textContent=wui('build',{value:s.build});
    uptimeTxt.textContent=formatUptime(s.uptime_s);
    renderTestState(s.test_open_active===true);
    return s;
  }catch(e){
    verTxt.textContent=wui('version_unknown');
    uptimeTxt.textContent=wui('uptime_unknown');
    buildTxt.textContent=wui('state_unavailable',{error:uiError(e)});
    renderTestState(null);
    return null;
  }
}
function relativeRaw(raw,zero,calibrated){
  return calibrated&&Number.isInteger(raw)&&raw>=0&&Number.isInteger(zero)&&zero>=0?String(raw-zero):'—';
}
async function loadUlp(){
  try{
    let u=await j('/api/ulp');
    ubattery.textContent=u.battery_mv>=0?wui('voltage',{value:(u.battery_mv/1000).toFixed(2)}):'—';
    const calibrated=u.calibration_valid===true,zero=u.calibration_contact_raw;
    usense.textContent=testKnown&&testActive&&!testRequestPending?relativeRaw(u.sense_raw,zero,calibrated):'—';
    ucalopen.textContent=relativeRaw(u.calibration_open_raw,zero,calibrated);
    ucontactraw.textContent=relativeRaw(u.contact_threshold_raw,zero,calibrated);
    ulpStatus.textContent=wui('updated');
  }catch(e){ubattery.textContent='—';usense.textContent='—';ucalopen.textContent='—';ucontactraw.textContent='—';ulpStatus.textContent=uiError(e)}
}
// Slider values map to the negative RSSI threshold expected by the API.
function zoneSliderToRssi(){return -Number(pr.value)}
function rssiToZoneSlider(value){return Math.min(127,Math.max(30,-Number(value)))}
function updateZoneValue(){const value=zoneSliderToRssi()+' dBm';pr.setAttribute('aria-valuetext',value);prKnob.setAttribute('aria-valuetext',value)}
async function loadConfig(){let c=await j('/api/config');pr.value=rssiToZoneSlider(c.phone_rssi_threshold);prKnob.knobValue=pr.value;updateZoneValue();ta.value=c.timer_a_ms;taKnob.knobValue=ta.value;beaconReopenProtection.value=c.beacon_reopen_protection_ms;beaconReopenProtectionKnob.knobValue=beaconReopenProtection.value;updateTimerAValue();updateBeaconReopenProtectionValue();savedDeparturePulse=c.departure_buzzer_enabled?Math.min(120,Math.max(0,c.departure_buzzer_pulse_ms??20)):0;departurePulse.value=pulseMsToSlider(savedDeparturePulse);departurePulseKnob.knobValue=departurePulse.value;updateDeparturePulseValue()}
let savedDeparturePulse=20;
let departurePreviewPending=null,departurePreviewRunning=false;
function pulseSliderToMs(value){return Math.round(Math.expm1(Math.min(1000,Math.max(0,Number(value)))/1000*Math.log1p(120)))}
function pulseMsToSlider(value){return Math.round(Math.log1p(Math.min(120,Math.max(0,Number(value))))/Math.log1p(120)*1000)}
function updateDeparturePulseValue(preview=false){const ms=pulseSliderToMs(departurePulse.value),value=ms===0?wui('sound_off'):wui('milliseconds',{value:ms});departurePulse.setAttribute('aria-valuetext',value);departurePulseKnob.setAttribute('aria-valuetext',value);if(preview){departurePreviewPending=ms;sendDeparturePreview()}}
async function sendDeparturePreview(){if(departurePreviewRunning)return;departurePreviewRunning=true;try{while(departurePreviewPending!==null){const ms=departurePreviewPending;departurePreviewPending=null;await j('/api/config/departure-buzzer-preview?ms='+encodeURIComponent(ms),{method:'POST'})}}catch(e){departurePreviewPending=null;showNotice(wui('preview_sound_failed',{error:uiError(e)}),true)}finally{departurePreviewRunning=false}}
async function saveDeparturePulse(){if(departurePulse.disabled)return;departurePulse.disabled=true;try{const ms=pulseSliderToMs(departurePulse.value);await j('/api/config/departure-buzzer-pulse?ms='+encodeURIComponent(ms),{method:'POST'});savedDeparturePulse=ms;departurePulseKnob.flashSavedValue()}catch(e){departurePulse.value=pulseMsToSlider(savedDeparturePulse);departurePulseKnob.knobValue=departurePulse.value;updateDeparturePulseValue();showNotice(uiError(e),true)}finally{departurePulse.disabled=false}}

function closeMqttBrokerList(){mqttBrokerList.hidden=true;mqttBrokerButton.setAttribute('aria-expanded','false')}
function toggleMqttBrokerList(){if(mqttBrokerButton.disabled)return;const opening=mqttBrokerList.hidden;mqttBrokerList.hidden=!opening;mqttBrokerButton.setAttribute('aria-expanded',String(opening));if(opening)mqttBrokerList.scrollIntoView({block:'nearest'})}
function renderMqttBrokerChoices(hosts){closeMqttBrokerList();mqttBrokerList.replaceChildren(...hosts.map(host=>{const item=document.createElement('button');item.type='button';item.textContent=host;item.onclick=()=>{mHost.value=host;mSaved.textContent='';closeMqttBrokerList();mqttBrokerButton.focus()};return item}));mqttBrokerButton.disabled=hosts.length===0}
document.addEventListener('click',e=>{if(!mqttBrokerField.contains(e.target))closeMqttBrokerList()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!mqttBrokerList.hidden){closeMqttBrokerList();mqttBrokerButton.focus()}});
async function loadMqtt(){try{let c=await j('/api/mqtt');mHost.value=c.host;renderMqttBrokerChoices(c.broker_choices??[]);mSave.disabled=!!c.busy}catch(e){mSaved.textContent=uiError(e)}}
async function refreshMqttBusy(){if(mqttSaveRunning)return;try{let c=await j('/api/mqtt');mSave.disabled=!!c.busy}catch(e){mSave.disabled=false}}
// Remote unlock stays enabled; this field is not a user-configurable setting.
let mqttSaveRunning=false;
async function saveMqtt(){if(mqttSaveRunning)return false;const cfg={enabled:true,host:mHost.value.trim()};mqttSaveRunning=true;mSave.disabled=true;mHost.disabled=true;mqttBrokerButton.disabled=true;try{await j('/api/mqtt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)});if(!window.BleLockMqttConfig||!window.BleLockMqttConfig.saveBrokerHost(cfg.host))throw Error('WUI_E_APP_SYNC');mSaved.textContent=wui('saved');return true}catch(e){mSaved.textContent=uiError(e);return false}finally{mqttSaveRunning=false;mHost.disabled=false;mqttBrokerButton.disabled=mqttBrokerList.childElementCount===0;await refreshMqttBusy()}}
async function loadWifi(){try{let c=await j('/api/wifi');wssid.value=c.ssid;wpass.value='';wauto.checked=c.auto_connect;wifiSaved.textContent=c.password_configured?wui('wifi_password_saved'):wui('wifi_password_not_set')}catch(e){wifiSaved.textContent=uiError(e)}}
async function saveAutoConnect(){try{let q=new URLSearchParams({auto_connect:wauto.checked?'1':'0'});await j('/api/wifi/auto?'+q,{method:'POST'});autoSaved.textContent=wui('saved');setTimeout(()=>autoSaved.textContent='',2000)}catch(e){autoSaved.textContent=wui('save_error');throw e}}
async function saveWifi(){try{let q=new URLSearchParams({ssid:wssid.value,password:wpass.value});await j('/api/wifi',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:q});await saveAutoConnect();wpass.value='';wifiSaved.textContent=wui('saved')}catch(e){wifiSaved.textContent=uiError(e)}}
async function restartEsp(){try{let reply=await j('/api/system/restart',{method:'POST'});if(reply.accepted){restartButton.classList.remove('command-ok');void restartButton.offsetWidth;restartButton.classList.add('command-ok');setTimeout(()=>restartButton.classList.remove('command-ok'),700)}}catch(e){showNotice(wui('restart_not_confirmed',{error:uiError(e)}),true)}}
function updateTimerAValue(){const value=wui('seconds',{value:(Number(ta.value)/1000).toFixed(1).replace('.',wui('decimal_separator'))});ta.setAttribute('aria-valuetext',value);taKnob.setAttribute('aria-valuetext',value)}
function updateBeaconReopenProtectionValue(){const value=wui('seconds',{value:(Number(beaconReopenProtection.value)/1000).toFixed(1).replace('.',wui('decimal_separator'))});beaconReopenProtection.setAttribute('aria-valuetext',value);beaconReopenProtectionKnob.setAttribute('aria-valuetext',value)}
let configSaveRunning=false;const configSavePendingKnobs=new Set();
async function saveConfig(knobId){if(knobId)configSavePendingKnobs.add(knobId);if(configSaveRunning)return;configSaveRunning=true;try{while(configSavePendingKnobs.size){const changedKnobs=[...configSavePendingKnobs];configSavePendingKnobs.clear();let q=new URLSearchParams({phone_rssi_threshold:zoneSliderToRssi(),timer_a_ms:ta.value,beacon_reopen_protection_ms:beaconReopenProtection.value});await j('/api/config?'+q,{method:'POST'});changedKnobs.forEach(id=>document.getElementById(id)?.flashSavedValue())}}catch(e){configSavePendingKnobs.clear();showNotice(uiError(e),true)}finally{configSaveRunning=false}}
async function testOpen(){
  if(!testKnown||testRequestPending)return;
  const desired=!testActive;
  testRequestPending=true;testOpenButton.disabled=true;
  if(!desired)usense.textContent='—';
  try{
    if(!desired&&testLeaseRequest)await testLeaseRequest.catch(()=>{});
    await j('/api/lock/test?enabled='+(desired?'1':'0'),{method:'POST'});
    let confirmed=false;
    for(let attempt=0;attempt<20;attempt++){
      await new Promise(resolve=>setTimeout(resolve,150));
      const status=await loadStatus();
      if(!status)throw Error('WUI_E_REQUEST');
      if(status.test_open_active===desired){confirmed=true;break}
    }
    if(!confirmed)throw Error('WUI_E_REQUEST');
  }catch(e){showNotice(uiError(e),true);await loadStatus()}
  finally{testRequestPending=false;testOpenButton.disabled=!testKnown}
}
async function refreshTestLease(){
  if(!testKnown||!testActive||testRequestPending||testLeaseRequest)return;
  testLeaseRequest=j('/api/lock/test?enabled=1',{method:'POST'});
  try{await testLeaseRequest}
  catch(e){renderTestState(null);ulpStatus.textContent=uiError(e)}
  finally{testLeaseRequest=null}
}
async function loadPairing(){try{let p=await j('/api/ble/registration');pairingButton.textContent=p.allowed?wui('pairing_remaining',{seconds:p.remaining_s}):wui('allow_phone_registration');pairingButton.title=''}catch(e){pairingButton.textContent=wui('pairing_offline');pairingButton.title=uiError(e)}}
async function allowPairing(){try{await j('/api/ble/registration',{method:'POST'});await loadPairing();showNotice(wui('pairing_allowed'))}catch(e){showNotice(uiError(e),true)}}
async function loadBonds(){try{let a=await j('/api/ble/bonds');bonds.innerHTML=a.map(b=>`<tr><td>${esc(b.name||wui('unnamed_phone'))}</td><td>${esc(b.address)}</td><td><button class="btn-danger" onclick='deleteBond(${JSON.stringify(b.address)})'>${wui('delete')}</button></td></tr>`).join('')||`<tr class="muted-row"><td colspan='3'>${wui('no_registered_phones')}</td></tr>`}catch(e){bonds.innerHTML=`<tr><td colspan='3'>${esc(uiError(e))}</td></tr>`}}
async function deleteBond(a){await inlineConfirm('bond:'+a,wui('confirm_delete_phone',{address:a}),async()=>{try{await j('/api/ble/bonds?address='+encodeURIComponent(a),{method:'DELETE'});await loadBonds();showNotice(wui('phone_deleted'))}catch(e){showNotice(uiError(e),true)}})}
async function deleteAllBonds(){await inlineConfirm('all-bonds',wui('confirm_delete_all'),async()=>{try{await j('/api/ble/bonds?all=1',{method:'DELETE'});await loadBonds();showNotice(wui('all_phones_deleted'))}catch(e){showNotice(uiError(e),true)}})}
function readOtaState(){try{let state=JSON.parse(sessionStorage.getItem('bleLockOta'));if(state&&Date.now()-state.started<600000)return state;sessionStorage.removeItem('bleLockOta')}catch(e){}return null}
function saveOtaState(state){try{if(state)sessionStorage.setItem('bleLockOta',JSON.stringify(state));else sessionStorage.removeItem('bleLockOta')}catch(e){}}
function otaSuccessText(version){return wui('lock_updated',{version})}
async function waitFwUpdate(before){
  ota.textContent=wui('finishing_update');
  for(let attempt=0;attempt<60;attempt++){
    await new Promise(resolve=>setTimeout(resolve,1000));
    try{
      let after=await j('/api/status');
      if(after.version!==before.version||after.uptime_s<before.uptime_s){
        saveOtaState({complete:true,version:after.version,started:Date.now()});
        ota.textContent=otaSuccessText(after.version);
        showNotice(wui('lock_updated_notice'));
        await loadStatus();
        return;
      }
    }catch(e){}
  }
  saveOtaState(null);
  ota.textContent=wui('update_not_confirmed');
}
async function resumeFwUpdate(){let state=readOtaState();if(!state)return;if(state.complete){ota.textContent=otaSuccessText(state.version);return}if(uploadFwButton.disabled)return;uploadFwButton.disabled=true;try{await waitFwUpdate(state.before)}finally{uploadFwButton.disabled=false}}
async function uploadFw(){
  if(uploadFwButton.disabled)return;
  if(!window.bleLockInternalFirmware){showNotice(wui('update_requires_app'),true);return}
  uploadFwButton.disabled=true;
  saveOtaState(null);
  ota.textContent=wui('preparing_firmware');
  try{
    let cached=await fetch('/__app/firmware',{cache:'no-store'});
    if(!cached.ok)throw new Error('WUI_E_FIRMWARE_MISSING');
    let f=await cached.blob();
    let before=await j('/api/status');
    saveOtaState({before:before,started:Date.now()});
    ota.textContent=wui('transferring_firmware');
    let r=await fetch('/api/ota',{method:'POST',body:f});
    let message=await r.text();
    if(!r.ok)throw new Error('WUI_E_OTA_FAILED');
    await waitFwUpdate(before);
  }catch(e){saveOtaState(null);ota.textContent=uiError(e)}
  finally{uploadFwButton.disabled=false}
}
let fastRefreshBusy=false,slowRefreshBusy=false;
async function refreshFast(){if(fastRefreshBusy)return;fastRefreshBusy=true;try{await loadStatus();await loadUlp();await loadPairing()}finally{fastRefreshBusy=false}}
async function refreshSlow(){if(slowRefreshBusy)return;slowRefreshBusy=true;try{await loadBonds()}finally{slowRefreshBusy=false}}
async function initPage(){renderTestState(null);await loadConfig();await loadWifi();await loadMqtt();await refreshFast();await refreshSlow();resumeFwUpdate();setInterval(refreshFast,1000);setInterval(refreshSlow,3000);setInterval(refreshMqttBusy,2000);setInterval(refreshTestLease,2000)}
window.initializeLocalizedPage=initPage;
</script>
