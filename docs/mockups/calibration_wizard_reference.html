<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLE Lock — мастер калибровки</title><style>body{font-family:Arial,sans-serif;margin:20px;max-width:900px;background:#f3f5f7;color:#20242a}section{background:#fff;padding:16px;margin:12px 0;border-radius:10px}button{padding:9px 14px;margin:3px;border:1px solid #bbb;border-radius:7px;background:#fff}button.primary{background:#20242a;color:#fff}.muted{color:#777}.steps{display:flex;gap:8px;flex-wrap:wrap}.step{padding:7px 11px;border-radius:999px;background:#e8ebef}.step.active{background:#d9e9ff;font-weight:bold}.step.done{background:#dff3e7}.card{background:#f8f9fa;padding:12px;border-radius:8px;margin-top:10px}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:20px}.modal{background:#fff;border-radius:12px;max-width:600px;width:100%;padding:20px}</style></head><body><h1>BLE Lock</h1><section><h2>Калибровка магнитной системы</h2><p class="muted">Автоматический голосовой мастер.</p><div class="steps"><span class="step active" id="s1">1. Полный контакт</span><span class="step" id="s2">2. Дверь открыта</span><span class="step" id="s3">3. Зазор бумаги</span><span class="step" id="s4">Результат</span></div><div class="card"><b>Состояние:</b> <span id="wizardState">не запущен</span><br><b>Инструкция:</b> <span id="instruction">—</span><br><b>Условие:</b> <span id="condition">—</span></div><p><button class="primary" id="startBtn" onclick="startCalibration()">Запустить калибровку</button><button id="cancelBtn" onclick="cancelCalibration()" disabled>Отмена</button><button onclick="repeatVoice()">Повторить голосовую инструкцию</button></p></section><div class="modal-backdrop" id="wizardBackdrop"><div class="modal"><h2 id="wizardModalTitle"></h2><p id="wizardModalText"></p><div class="card">Мастер сам определит, когда условие выполнено.</div></div></div><script>let running=false,stage=0,currentDisplay='',currentSpeech='',repeatTimer=null,conditionTimer=null;const REPEAT_MS=7000;function showModal(title,text){wizardModalTitle.textContent=title;wizardModalText.textContent=text;wizardBackdrop.style.display='flex'}function hideModal(){wizardBackdrop.style.display='none'}function say(display,speech,done){currentDisplay=display;currentSpeech=speech||display;instruction.textContent=display;if(!('speechSynthesis'in window)){if(done)setTimeout(done,300);return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(currentSpeech);u.lang='ru-RU';u.onend=()=>done&&done();u.onerror=()=>done&&done();speechSynthesis.speak(u)}function repeatVoice(){if(currentDisplay)say(currentDisplay,currentSpeech)}function armRepeat(){clearTimeout(repeatTimer);repeatTimer=setTimeout(function again(){if(!running||wizardState.textContent!=='WAIT_CONDITION')return;say(currentDisplay,currentSpeech,()=>{repeatTimer=setTimeout(again,REPEAT_MS)})},REPEAT_MS)}function clearRepeat(){clearTimeout(repeatTimer)}function setSteps(n){for(let i=1;i<=3;i++){let e=document.getElementById('s'+i);e.className='step'+(i<n?' done':i===n?' active':'')}s4.className='step'+(n===4?' active':'')}function instructionFor(n){if(n===1)return['Шаг 1 — полный контакт','Прижмите дверь и удерживайте её полностью закрытой.','Прижми́те дверь и уде́рживайте её по́лностью закры́той.'];if(n===2)return['Шаг 2 — дверь открыта','Откройте дверь и оставьте её открытой.','Откро́йте дверь и оста́вьте её откры́той.'];return['Шаг 3 — зазор бумаги','Разместите один лист бумаги между замком и пластиной и прижмите дверь.','Размести́те оди́н лист бума́ги ме́жду замко́м и пласти́ной и прижми́те дверь.']}function enterStage(n){stage=n;setSteps(n);wizardState.textContent='WAIT_CONDITION';condition.textContent='Ожидание выполнения условия';let a=instructionFor(n);showModal(a[0],a[1]);say(a[1],a[2],armRepeat);/* Демонстрация: реальная версия ждёт данные ESP/ULP. */clearTimeout(conditionTimer);conditionTimer=setTimeout(()=>conditionDetected(),10000)}function conditionDetected(){if(!running)return;clearRepeat();wizardState.textContent='COLLECTING';condition.textContent='Условие подтверждено, выполняются измерения';setTimeout(()=>stepComplete(),1800)}function stepComplete(){if(stage<3){hideModal();say('Хорошо, этот шаг пройден.','Хорошо́, э́тот шаг про́йден.',()=>enterStage(stage+1))}else finishCalibration()}function startCalibration(){if(running)return;running=true;startBtn.disabled=true;cancelBtn.disabled=false;enterStage(1)}function cancelCalibration(){running=false;clearRepeat();clearTimeout(conditionTimer);if('speechSynthesis'in window)speechSynthesis.cancel();hideModal();wizardState.textContent='отменён';startBtn.disabled=false;cancelBtn.disabled=true}function finishCalibration(){clearRepeat();setSteps(4);wizardState.textContent='COMPLETE';condition.textContent='Калибровка завершена';showModal('Калибровка завершена','Калибровка успешно завершена.');say('Калибровка успешно завершена.','Калибро́вка успе́шно завершена́.',()=>{running=false;startBtn.disabled=false;cancelBtn.disabled=true;setTimeout(hideModal,1800)})}</script></body></html>
