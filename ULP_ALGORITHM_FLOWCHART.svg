<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #475569; }
      .section { font: 700 22px Arial, sans-serif; fill: #ffffff; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 16px Arial, sans-serif; fill: #334155; }
      .small { font: 400 14px Arial, sans-serif; fill: #475569; }
      .label { font: 700 14px Arial, sans-serif; fill: #334155; }
      .box { stroke-width: 2; rx: 14; filter: url(#shadow); }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#f8fafc"/>
  <text x="800" y="55" text-anchor="middle" class="title">ULP-контроллер соленоида</text>
  <text x="800" y="84" text-anchor="middle" class="subtitle">Команды OPEN / CLOSE, диагностика и mailbox ESP32</text>

  <!-- mailbox -->
  <rect x="330" y="115" width="940" height="120" fill="#e0f2fe" stroke="#0284c7" class="box"/>
  <text x="800" y="148" text-anchor="middle" class="box-title">Mailbox: обмен с основным CPU</text>
  <text x="800" y="177" text-anchor="middle" class="box-text">CPU записывает: command, command_sequence</text>
  <text x="800" y="202" text-anchor="middle" class="box-text">ULP возвращает: command_ack_sequence, state, FSM, ADC, faults, events</text>
  <path d="M800 235 L800 270" class="arrow"/>

  <!-- command -->
  <rect x="570" y="270" width="460" height="70" fill="#fef3c7" stroke="#d97706" class="box"/>
  <text x="800" y="300" text-anchor="middle" class="box-title">ULP просыпается</text>
  <text x="800" y="325" text-anchor="middle" class="box-text">Читает команду и подтверждает sequence</text>
  <path d="M800 340 L800 375" class="arrow"/>

  <!-- split -->
  <path d="M800 375 L400 420" class="arrow"/>
  <path d="M800 375 L1200 420" class="arrow"/>
  <text x="595" y="400" class="label">OPEN</text>
  <text x="1020" y="400" class="label">CLOSE</text>

  <!-- open header -->
  <rect x="90" y="420" width="620" height="52" fill="#2563eb" stroke="#1d4ed8" class="box"/>
  <text x="400" y="454" text-anchor="middle" class="section">OPEN — открыть замок</text>
  <path d="M400 472 L400 510" class="arrow"/>

  <rect x="100" y="510" width="600" height="78" fill="#dbeafe" stroke="#3b82f6" class="box"/>
  <text x="400" y="540" text-anchor="middle" class="box-title">1. Выключить соленоид</text>
  <text x="400" y="565" text-anchor="middle" class="box-text">Ждать разряд катушки</text>
  <path d="M400 588 L400 625" class="arrow"/>

  <rect x="100" y="625" width="600" height="78" fill="#dbeafe" stroke="#3b82f6" class="box"/>
  <text x="400" y="655" text-anchor="middle" class="box-title">2. Проверить остаточный ток</text>
  <text x="400" y="680" text-anchor="middle" class="box-text">ADC: остаток не должен быть выше нормы</text>
  <path d="M400 703 L400 735" class="arrow"/>

  <polygon points="400,735 510,800 400,865 290,800" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="795" text-anchor="middle" class="box-title">Ток нормальный?</text>
  <text x="400" y="820" text-anchor="middle" class="small">да / нет</text>
  <path d="M290 800 L170 800 L170 930" class="arrow"/>
  <text x="215" y="790" class="label">НЕТ</text>
  <path d="M510 800 L620 800 L620 930" class="arrow"/>
  <text x="535" y="790" class="label">ДА</text>

  <rect x="80" y="930" width="240" height="90" fill="#fee2e2" stroke="#dc2626" class="box"/>
  <text x="200" y="965" text-anchor="middle" class="box-title">FAULT</text>
  <text x="200" y="990" text-anchor="middle" class="box-text">COIL_SHORT</text>
  <text x="200" y="1010" text-anchor="middle" class="small">событие OPEN_FAILED</text>

  <rect x="500" y="930" width="240" height="90" fill="#dcfce7" stroke="#16a34a" class="box"/>
  <text x="620" y="965" text-anchor="middle" class="box-title">UNLOCKED</text>
  <text x="620" y="990" text-anchor="middle" class="box-text">событие UNLOCKED</text>
  <text x="620" y="1010" text-anchor="middle" class="small">затем диагностика</text>

  <!-- close header -->
  <rect x="890" y="420" width="620" height="52" fill="#7c3aed" stroke="#6d28d9" class="box"/>
  <text x="1200" y="454" text-anchor="middle" class="section">CLOSE — закрыть замок</text>
  <path d="M1200 472 L1200 510" class="arrow"/>

  <rect x="900" y="510" width="600" height="78" fill="#ede9fe" stroke="#8b5cf6" class="box"/>
  <text x="1200" y="540" text-anchor="middle" class="box-title">1. Измерить механизм</text>
  <text x="1200" y="565" text-anchor="middle" class="box-text">База, VBAT, ток, delta и feature</text>
  <path d="M1200 588 L1200 625" class="arrow"/>

  <rect x="900" y="625" width="600" height="78" fill="#ede9fe" stroke="#8b5cf6" class="box"/>
  <text x="1200" y="655" text-anchor="middle" class="box-title">2. Определить plate_state</text>
  <text x="1200" y="680" text-anchor="middle" class="box-text">CONTACT, GAP_1 ... FAR</text>
  <path d="M1200 703 L1200 735" class="arrow"/>

  <polygon points="1200,735 1310,800 1200,865 1090,800" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="1200" y="795" text-anchor="middle" class="box-title">CONTACT/GAP_1?</text>
  <text x="1200" y="820" text-anchor="middle" class="small">можно закрывать?</text>
  <path d="M1090 800 L970 800 L970 930" class="arrow"/>
  <text x="1015" y="790" class="label">НЕТ</text>
  <path d="M1310 800 L1420 800 L1420 930" class="arrow"/>
  <text x="1335" y="790" class="label">ДА</text>

  <rect x="880" y="930" width="240" height="90" fill="#fee2e2" stroke="#dc2626" class="box"/>
  <text x="1000" y="965" text-anchor="middle" class="box-title">CLOSE_REJECTED</text>
  <text x="1000" y="990" text-anchor="middle" class="box-text">соленоид выключен</text>
  <text x="1000" y="1010" text-anchor="middle" class="small">состояние UNLOCKED</text>

  <rect x="1300" y="930" width="240" height="90" fill="#ede9fe" stroke="#8b5cf6" class="box"/>
  <text x="1420" y="960" text-anchor="middle" class="box-title">Удержание</text>
  <text x="1420" y="985" text-anchor="middle" class="box-text">соленоид ON 300 мс</text>
  <text x="1420" y="1005" text-anchor="middle" class="small">затем LOCKED</text>

  <!-- common mailbox -->
  <path d="M620 1020 L620 1080 L800 1080" class="arrow"/>
  <path d="M1000 1020 L1000 1080 L800 1080" class="arrow"/>
  <path d="M1420 1020 L1420 1080 L800 1080" class="arrow"/>
  <rect x="490" y="1080" width="620" height="72" fill="#e0f2fe" stroke="#0284c7" class="box"/>
  <text x="800" y="1110" text-anchor="middle" class="box-title">Записать результат в mailbox</text>
  <text x="800" y="1135" text-anchor="middle" class="box-text">state, FSM, измерения, faults, events, counters</text>

  <text x="800" y="1185" text-anchor="middle" class="subtitle">Основной CPU читает данные только при согласованном чётном sequence</text>
</svg>
